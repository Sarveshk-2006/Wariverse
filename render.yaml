services:
  - type: web
    name: wariverse-api
    env: python
    region: singapore
    plan: starter
    rootDir: services/api
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DEMO_MODE
        value: "false"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        value: "sqlite+aiosqlite:///./wariverse.db"
      - key: XAI_REALTIME_MODEL
        value: "grok-2-realtime"
      - key: XAI_REALTIME_BASE_URL
        value: "https://api.x.ai/v1"
      - key: XAI_VOICE
        value: "ara"
      - key: CORS_ORIGINS
        value: "https://web-one-tau-17.vercel.app,http://localhost:3000"
      - key: XAI_API_KEY
        sync: false
